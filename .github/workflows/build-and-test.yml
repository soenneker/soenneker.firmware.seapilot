name: build-and-test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-rc.3.26522.148

      - name: Restore tests
        run: dotnet restore test/Soenneker.Firmware.SeaPilot.Tests/Soenneker.Firmware.SeaPilot.Tests.csproj --verbosity minimal

      - name: Build and smoke-test CLI
        shell: bash
        run: |
          dotnet build src/Soenneker.Firmware.SeaPilot.Cli -c Release
          dotnet run --project src/Soenneker.Firmware.SeaPilot.Cli -c Release --no-build -- --help
          dotnet run --project src/Soenneker.Firmware.SeaPilot.Cli -c Release --no-build -- cached CLISMOKETEST

      - name: Build tests
        run: dotnet build test/Soenneker.Firmware.SeaPilot.Tests/Soenneker.Firmware.SeaPilot.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Firmware.SeaPilot.Tests/Soenneker.Firmware.SeaPilot.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal

      - name: Pack
        run: dotnet pack src/Soenneker.Firmware.SeaPilot/Soenneker.Firmware.SeaPilot.csproj --configuration Release --no-build --no-restore --output . --verbosity minimal
